name: Construire l'application Android

# Lancement manuel : onglet "Actions" > "Construire l'application Android" > "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Copier le site dans www
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-*.png www/

      - name: Créer le projet Android
        run: npx cap add android

      - name: Ajouter la configuration Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Le secret GOOGLE_SERVICES_JSON est vide. Ajoute le contenu du fichier google-services.json."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          if ! grep -q "\"package_name\": \"$APP_ID\"" android/app/google-services.json; then
            echo "::error::Le package_name de google-services.json ne correspond pas à l'appId ($APP_ID) de capacitor.config.json."
            exit 1
          fi

      - name: Icônes de l'application
        run: npx capacitor-assets generate --android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Régler la version et les permissions
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$MANIFEST"
          TARGET=$(grep -o "targetSdkVersion *= *[0-9]*" android/variables.gradle | grep -o "[0-9]*$")
          echo "targetSdkVersion = $TARGET"
          if [ "${TARGET:-0}" -lt 36 ]; then
            echo "::error::targetSdkVersion ($TARGET) est inférieur à 36."
            exit 1
          fi

      - name: Construire le bundle (.aab) et l'APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Signer le bundle et l'APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 est vide."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

          # --- Bundle (.aab) pour Google Play, si besoin un jour ---
          cp android/app/build/outputs/bundle/release/app-release.aab espace-classe.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            espace-classe.aab "$KEY_ALIAS"

          # --- APK installable directement ---
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK_IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK trouvé : $APK_IN"
          "$BT/zipalign" -p -f 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upload.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out espace-classe.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify espace-classe.apk && echo "APK signé OK"

          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: espace-classe-android
          path: |
            espace-classe.apk
            espace-classe.aab
          retention-days: 14

      - name: Publier l'APK (lien de téléchargement fixe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" espace-classe.apk \
            --title "Espace Classe Android - version ${{ github.run_number }}" \
            --notes "Télécharge espace-classe.apk sur ton téléphone Android puis ouvre-le pour l'installer." \
            --latest
